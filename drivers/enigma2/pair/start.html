<style>
    .pairSettings input {
        margin-top: 10px;
        /* Adds space above each input field */
    }

    .pairSettings td:first-child {
        padding-right: 10px;
        /* Adds space between label and input field */
    }
</style>

<script>
    Homey.setTitle(__('pair.start.title'));

    function getFormData() {
        return {
            IPAddress: document.getElementById('IPAddress').value.trim(),
            Port: document.getElementById('Port').value,
            PollInterval: document.getElementById('PollInterval').value,
            Username: document.getElementById('Username').value,
            Password: document.getElementById('Password').value,
            Protocol: document.getElementById('Protocol').value,
            AllowSelfSigned: document.getElementById('AllowSelfSigned').checked
        };
    }

    function saveSettings() {
        var button = document.getElementById('saveSettings');
        button.disabled = true;
        Homey.emit('get_devices', getFormData(), function (err) {
            button.disabled = false;
            if (err) return Homey.alert(err.message || String(err), 'error');
            Homey.showView('get_devices');
        });
    }

    function testConnection() {
        Homey.emit('test_connection', getFormData(), function (err) {
            if (err) return Homey.alert(__('pair.start.connection_failed') + ' ' + (err.message || String(err)), 'error');
            Homey.alert(__('pair.start.connection_success'), 'info');
        });
    }
</script>

<div>
    <p data-i18n="pair.start.intro"></p>
    <table class="pairSettings">
        <tr>
            <td><span data-i18n="pair.start.ipAddress"></span></td>
            <td><input id="IPAddress" type="text" placeholder="192.168.1.10" /></td>
        </tr>
        <tr>
            <td><span data-i18n="pair.start.port"></span></td>
            <td><input id="Port" type="number" min="1" max="65535" step="1" value="443" /></td>
        </tr>
        <tr>
            <td><span data-i18n="pair.start.pollInterval"></span></td>
            <td><input id="PollInterval" type="number" min="5" max="60" step="1" value="5" /></td>
        </tr>
        <tr>
            <td><span data-i18n="pair.start.username"></span></td>
            <td><input id="Username" type="text" /></td>
        </tr>
        <tr>
            <td><span data-i18n="pair.start.password"></span></td>
            <td><input id="Password" type="password" /></td>
        </tr>
        <tr>
            <td><span data-i18n="pair.start.protocol"></span></td>
            <td><select id="Protocol"><option value="auto" data-i18n="pair.start.auto"></option><option value="http">HTTP</option><option value="https">HTTPS</option></select></td>
        </tr>
        <tr>
            <td><label for="AllowSelfSigned" data-i18n="pair.start.allowSelfSigned"></label></td>
            <td><input id="AllowSelfSigned" type="checkbox" checked /></td>
        </tr>
    </table>
    <fieldset style="text-align: center;">
        <button class="homey-button-small" onclick="testConnection()" style="margin-right: 10px;"><span
                data-i18n="pair.start.testConnection"></span></button>
        <button class="homey-button-small" id="saveSettings" onclick="saveSettings()"><span
                data-i18n="pair.start.saveSettings"></span></button>
    </fieldset>

</div>
